<script>
const pack = JSON.parse(document.getElementById("data").textContent);
let lang = "zh";
const $ = (s) => document.getElementById(s);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function jobHtml(job) {
  const stack = (job.stack || []).map((s) => "<span>" + esc(s) + "</span>").join("");
  const projects = (job.projects || []).map((p, i) => {
    const n = String(i + 1).padStart(2, "0");
    const bullets = p.bullets.map((b) => "<li><strong>" + esc(b.lead) + ".</strong> <span class=\"muted\">" + esc(b.body) + "</span></li>").join("");
    const results = p.results.map((r) => "<li>" + esc(r) + "</li>").join("");
    return '<div class="proj"><div class="proj-t"><span class="num">' + n + '</span><h4>' + esc(p.title) + '</h4></div><p class="tags">' + esc(p.period) + " · " + esc(p.tags.join(" · ")) + '</p><p class="ctx">' + esc(p.context) + '</p><ul class="clean">' + bullets + '</ul><ul class="results">' + results + "</ul></div>";
  }).join("");
  const bullets = (job.bullets || []).map((b) => "<li><strong>" + esc(b.lead) + ".</strong> <span class=\"muted\">" + esc(b.body) + "</span></li>").join("");
  const results = (job.results || []).map((r) => "<li>" + esc(r) + "</li>").join("");
  return '<section class="job"><header class="job-h"><div><h3>' + esc(job.company) + '</h3><p class="who">' + esc(job.role) + '</p></div><p class="subtle">' + esc(job.period) + "</p></header>"
    + (job.summary ? '<p class="lead">' + esc(job.summary) + "</p>" : "")
    + (stack ? '<div class="stack">' + stack + "</div>" : "")
    + projects
    + (bullets ? '<ul class="clean">' + bullets + "</ul>" : "")
    + (results ? '<ul class="results">' + results + "</ul>" : "")
    + "</section>";
}

function render() {
  const t = pack[lang];
  const p = pack.profile;
  const name = p.nameZh + "  " + p.name;
  document.documentElement.lang = lang;
  document.title = name + " · Resume";
  $("lang").textContent = lang === "zh" ? "English" : "中文";
  $("print").textContent = lang === "zh" ? "打印 / PDF" : "Print / PDF";
  const skills = t.skillGroups.map((g) => '<div class="skill"><h3>' + esc(g.name) + "</h3><ul>" + g.items.map((i) => "<li>" + esc(i) + "</li>").join("") + "</ul></div>").join("");
  const stacks = t.stackGroups.map((g) => '<div class="skill"><h3>' + esc(g.name) + '</h3><div class="chips">' + g.items.map((i) => '<span class="chip">' + esc(i) + "</span>").join("") + "</div></div>").join("");
  const metrics = t.highlights.map((h) => '<div class="metric"><b>' + esc(h.value) + "</b><span>" + esc(h.label) + "</span></div>").join("");
  const ai = t.aiBody.map((x) => "<p>" + esc(x) + "</p>").join("");
  $("sheet").innerHTML =
    '<div class="layout"><aside class="rail">'
    + '<p class="kicker">' + esc(t.yearsLabel) + "</p>"
    + "<h1>" + esc(name) + "</h1>"
    + '<p class="role">' + esc(t.currentRole) + " · " + esc(t.company) + "</p>"
    + '<div class="contact"><div>' + esc(p.phone) + "</div><div><a href=\"mailto:" + esc(p.email) + '\">' + esc(p.email) + "</a></div></div>"
    + '<p class="label">' + esc(t.skillsTitle) + "</p>" + skills
    + '<p class="label">' + esc(t.sectionStack) + "</p>" + stacks
    + '</aside><div class="main"><div class="head"><p class="muted">' + esc(t.yearsLabel) + '</p><p style="margin-top:6px">' + esc(t.company) + " · " + esc(t.currentRole) + '</p><p class="subtle" style="margin-top:6px">' + esc(t.period) + "</p></div>"
    + "<h2>" + esc(t.sectionSummary) + '</h2><p class="lead">' + esc(t.summary) + "</p>"
    + "<h2>" + esc(t.highlightsTitle) + '</h2><div class="metrics">' + metrics + "</div>"
    + "<h2>" + esc(t.experienceTitle) + '</h2><p class="lead">' + esc(t.experienceIntro) + "</p>"
    + t.jobs.map(jobHtml).join("")
    + '<section class="block ai"><h2 style="margin-top:0">' + esc(t.aiTitle) + "</h2>" + ai + "</section>"
    + '<section class="block"><h2 style="margin-top:0">' + esc(t.eduTitle) + '</h2><p class="lead">' + esc(lang === "zh" ? p.education : t.educationLine) + "</p></section>"
    + "</div></div>";
}

$("lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; render(); };
$("print").onclick = () => window.print();
render();
</script>
